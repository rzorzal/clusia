[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/rzorzal/clusia"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
clusia-core = { path = "crates/clusia-core" }
clusia-store = { path = "crates/clusia-store" }
clusia-protocol = { path = "crates/clusia-protocol" }
clusia-platform = { path = "crates/clusia-platform" }
clusia-provider = { path = "crates/clusia-provider" }
clusia-git = { path = "crates/clusia-git" }
clusia-analytics = { path = "crates/clusia-analytics" }
clusia-view = { path = "crates/clusia-view" }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "fs", "process"] }
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2", "charset"] }
wiremock = "0.6.5"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
dispatch2 = "0.3.1"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
