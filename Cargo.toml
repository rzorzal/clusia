[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/rzorzal/clusia"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
clusia-core = { path = "crates/clusia-core" }
clusia-store = { path = "crates/clusia-store" }
clusia-protocol = { path = "crates/clusia-protocol" }
clusia-platform = { path = "crates/clusia-platform" }
clusia-provider = { path = "crates/clusia-provider" }
clusia-git = { path = "crates/clusia-git" }
clusia-analytics = { path = "crates/clusia-analytics" }
clusia-view = { path = "crates/clusia-view" }
clusia-highlight = { path = "crates/clusia-highlight" }
clusiad = { path = "crates/clusiad" }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
sha2 = "0.11.0"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "fs", "process"] }
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2", "charset"] }
wiremock = "0.6.5"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
dispatch2 = "0.3.1"
bevy = { version = "=0.19.1", default-features = false, features = ["default_app", "std", "bevy_winit", "multi_threaded", "ui_api", "ui_bevy_render", "ui_picking", "bevy_picking", "bevy_ui_widgets", "png", "system_clipboard", "default_font"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "jpeg"] }
crossbeam-channel = "0.5.17"
rfd = { version = "0.17.2", default-features = false }
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-swift = "0.7.4"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-bash = "0.25.1"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-sequel = "0.3.11"
# Default features only: `parser` would pull a second tree-sitter core.
tree-sitter-md = "0.5.3"
# No CLI or HTML renderer: only the event parser.
pulldown-cmark = { version = "0.13.4", default-features = false }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
