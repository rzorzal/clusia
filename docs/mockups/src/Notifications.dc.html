<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 960px; height: 480px; position: relative; overflow: hidden; border-radius: 10px; font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 13px; background: linear-gradient(135deg, #2c4a3a, #6d8a73 55%, #c9b98f);">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 26px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 14px; background: rgba(20,24,22,0.35); color: #fff; font-size: 12px;">
    <svg width="18" height="16" viewBox="0 0 76 64" aria-label="Clúsia, new activity"><g transform="translate(2.5 2.5) scale(0.93) rotate(-14 32 34)"><path d="M32 55V63" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path d="M32 1C46 10 55 24 53 37C51 49 42 55 32 57C22 55 13 49 11 37C9 24 18 10 32 1Z" fill="#fff"></path></g><circle cx="66" cy="12" r="8" fill="#fff"></circle></svg>
    <span>Sat 10:42</span>
  </div>
  <div style="position: absolute; right: 14px; top: 40px; width: 360px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(245,246,244,0.82); color: #1b1f1c; box-shadow: 0 8px 24px rgba(0,0,0,0.25);">
        <span style="width: 34px; height: 34px; flex: none; border-radius: 8px; background: #16191a; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-14 32 34)"><path d="M32 55V63" stroke="#9AA49C" stroke-width="3" stroke-linecap="round"></path><path d="M32 3C45 11 53 24 51 37C49 48 41 54 32 56C23 54 15 48 13 37C11 24 19 11 32 3Z" fill="#4CC35F"></path><g fill="none" stroke="#16191a" stroke-width="3" stroke-linecap="round"><path d="M21 26c3-4 5 4 8 0s5 4 8 0s5 4 7 0"></path><path d="M22 36c3-4 5 4 8 0s5 4 8 0"></path></g><circle cx="40" cy="45" r="3.6" fill="#F07A4A"></circle></g></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="display: flex; justify-content: space-between;"><b style="font-weight: 600;">{{n.title}}</b><span style="color: #6b746d; font-size: 11px;">{{n.when}}</span></span>
          <span style="line-height: 1.4;">{{n.body}}</span>
        </span>
      </div>
    </sc-for>
  </div>
  <span style="position: absolute; left: 24px; bottom: 20px; max-width: 420px; color: rgba(255,255,255,0.9); line-height: 1.5;">Clicking a notification opens the right place: the review, the saved review that went stale, or the agent's question. Each kind can be turned off, and Do not disturb silences all of them.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      notes: [
        { title: 'Review requested', when: 'now', body: '@octo asked you to review rzorzal/clusia #123 · feat: auth refresh' },
        { title: '#77 is out of date', when: '2m ago', body: '2 new commits on fix: cache invalidation. Claude Code is checking your 4 comments.' },
        { title: 'Claude Code needs your OK', when: '5m ago', body: 'Wants to run cargo test in the #123 worktree. Denied automatically in 2 minutes.' },
      ],
    };
  }
}
</script>
</body>
</html>
