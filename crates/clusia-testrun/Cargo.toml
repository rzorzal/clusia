[package]
name = "clusia-testrun"
description = "Runs a pull request's tests in isolation: engine detection, the recipe, both runners and the results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clusia-core.workspace = true
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[features]
test-kit = []

[dev-dependencies]
tempfile.workspace = true
# `start_paused` in the FakeExec tests needs the paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
